# ctun configuration — see DESIGN.md for the full schema.
# Edited via: ctun config

defaults:
  control_persist: "7d"            # how long an unused tunnel stays up; "yes" = until reboot/logout
  server_alive_interval: 60        # keepalive seconds, fights idle disconnects
  server_alive_count_max: 10       # missed keepalives before giving up: rides out ~10 min outages
  # ssh_config: ~/.ssh/config_hpc  # optional: alternative ssh config file (ssh -F); also per cluster
  # wsl_distro: Ubuntu             # Windows only: WSL distro that runs ssh (default distro if unset).
  #                                # On Windows, ssh runs inside WSL: identity_file, socket_dir and
  #                                # ssh_config are paths inside WSL (ssh_config: absolute, no `~`).
  terminal: auto                   # login --interactive popup: auto|gnome-terminal|xfce4-terminal|zenity

agent:
  preamble: |
    You operate on shared academic HPC clusters via `ctun`. Respect the stated
    restrictions and read `ctun -t <cluster> info` before submitting jobs.

clusters:

  # HOREKA @ KIT
  # ===============================
  # HoreKa 2 — KIT's NHR (national tier-2) supercomputer, successor of HoreKa
  # (legacy HoreKa, horeka.scc.kit.edu, is decommissioned end of 2026). One
  # login host per architecture: hk2-x86 and hk2-a64 (ARM, e.g. the B200 nodes
  # of 'gpu-b200'). Login: OTP, then service password.
  # ===============================
  # horeka:
  #   host: hk2-x86.scc.kit.edu      # hk2-a64.scc.kit.edu for the ARM (B200) nodes
  #   user: ab1234
  #   ssh_alias: horeka              # optional: reuse a ~/.ssh/config Host block
  #   requires_otp: true             # advisory: surfaced via `ctun info`
  #   strict_host_key_checking: 'yes'   # set by `ctun hostkey --pin`: accept only the pinned
  #   known_hosts_file: ~/.config/cluster-tunnel/known_hosts   # host key (default: accept-new)
  #   control_persist: "24h"
  #   description:                   # notes for the agent, shown by `ctun info` (one string
  #     - HoreKa 2 @ KIT (NHR). GPU jobs -> partition 'gpu-h100'.    # also works, but only a
  #     - Never run compute on the login node.                       # list takes `ctun note`)
  #   restrictions:                  # advisory only; surfaced via `ctun info`
  #     max_job_runtime: "2-00:00:00"  # 'cpu': 3-00:00:00
  #     allowed_partitions: [cpu, gpu-h100, gpu-h200, dev-cpu, dev-gpu-h100]
  #   budget:                        # omit to run unguarded
  #     script: budget/horeka.sh     # prints job-hours used since the session started
  #     session_limit: 500
  #     unit: jobh                   # job-hours (Slurm job wall-clock; concurrent jobs add up)
  #     guard_commands: [sbatch, srun, salloc, aslurm, aslurmx]
  #     guard_scope: every-command   # also inside `bash -c '...'`, after env/timeout/xargs;
  #                                  # default first-command: the first word only
  #     fail_mode: closed
  #   job_records: true              # `run` stores a record per submitted job in
  #                                  # ~/.ctun/jobs/ on the cluster (default true)

  # HAICORE @ KIT
  # ===============================
  # HAICORE — Helmholtz AI COmpute REsources @ KIT (NHR): a GPU cluster for
  # AI / machine-learning workloads. Login requires a one-time password (OTP).
  # From December 2026 HAICORE 3.0 runs on the HoreKa 2 login hosts (see above).
  # ===============================
  # haicore:
  #   host: haicore.scc.kit.edu
  #   user: ab1234
  #   requires_otp: true
  #   requires_password: true        # optional (default true). Set false for a
  #                                  # cluster that authenticates with OTP and/or
  #                                  # an SSH key but no service password — the
  #                                  # login popup then omits the password field.
  #   budget:                        # omit / leave session_limit unset to run unguarded
  #     script: budget/haicore.sh    # bundled; job wall-clock hours since session start
  #     session_limit: 200           # max job-hours per session (or pass `ctun login -l N`)
  #     unit: jobh
  #     guard_commands: [sbatch, srun, salloc, aslurm, aslurmx]
  #     fail_mode: closed

  # KCIST @ KIT
  # ===============================
  # KCIST — a KIT NVIDIA DeepOps Slurm GPU cluster (login2.kcist.kit.edu).
  # No OTP required; GPU nodes scheduled via Slurm, no enforced usage quotas.
  # ===============================
  # kcist:
  #   host: login2.kcist.kit.edu
  #   user: ab1234
  #   requires_otp: false
  #   budget:                        # omit / leave session_limit unset to run unguarded
  #     script: budget/kcist.sh      # bundled; job wall-clock hours since session start
  #     session_limit: 100           # max job-hours per session (or pass `ctun login -l N`)
  #     unit: jobh
  #     guard_commands: [sbatch, srun, salloc, aslurm, aslurmx]
  #     fail_mode: closed

  # INT-NANO @ KIT
  # ===============================
  # int-nano — KIT Institute of Nanotechnology (INT) Slurm cluster. No OTP
  # required. Set the real login host before use, and verify `sacct` reports
  # Start/End for the budget probe.
  # ===============================
  # intnano:
  #   host: intnano.example          # set the real login host
  #   user: ab1234
  #   requires_otp: false
  #   budget:                        # omit / leave session_limit unset to run unguarded
  #     script: budget/intnano.sh    # bundled; job wall-clock hours since session start
  #     session_limit: 200           # max job-hours per session (or pass `ctun login -l N`)
  #     unit: jobh
  #     guard_commands: [sbatch, srun, salloc, aslurm, aslurmx]
  #     fail_mode: closed

  # BWUNICLUSTER 3.0 @ KIT / bwHPC
  # ===============================
  # bwUniCluster 3.0 (uc3) — Baden-Württemberg bwHPC general-purpose cluster,
  # operated at KIT. The login host uc3.scc.kit.edu is load-balanced over the
  # login nodes and requires 2FA. KIT users prefix their username with 'ka_'.
  # Reachable only from BelWü networks (use the VPN off campus).
  # ===============================
  # bwuni3:
  #   host: uc3.scc.kit.edu
  #   user: ka_ab1234                # KIT users: 'ka_' prefix + local username
  #   requires_otp: true             # 2FA: service password + OTP
  #   description:
  #     - bwUniCluster 3.0 (uc3) @ KIT/bwHPC — general-purpose state cluster.
  #   budget:                        # omit / leave session_limit unset to run unguarded
  #     script: budget/bwuni3.sh     # bundled; job wall-clock hours since session start
  #     session_limit: 200           # max job-hours per session (or pass `ctun login -l N`)
  #     unit: jobh
  #     guard_commands: [sbatch, srun, salloc, aslurm, aslurmx]
  #     fail_mode: closed

  # JUPITER @ JSC
  # ===============================
  # JUPITER — the exascale system at Jülich Supercomputing Centre (EuroHPC).
  # SSH key only (no password): upload the public key with a `from=` clause in
  # JuDoor. A TOTP prompt follows the key only if MFA is enabled in JuDoor.
  # ===============================
  # jupiter:
  #   host: login.jupiter.fz-juelich.de
  #   user: ab1234                   # JuDoor username
  #   requires_password: false       # key-only login
  #   requires_otp: true             # set false if MFA is off in JuDoor
  #   description:
  #     - JUPITER @ JSC. Every job needs --account=<budget>; nodes are billed whole.
  #   restrictions:                  # advisory only; surfaced via `ctun info`
  #     max_job_runtime: "12:00:00"
  #     allowed_partitions: [booster]
  #   budget:                        # omit / leave session_limit unset to run unguarded
  #     script: budget/jupiter.sh    # bundled; job wall-clock hours since session start
  #     session_limit: 200           # max job-hours per session (or pass `ctun login -l N`)
  #     unit: jobh
  #     guard_commands: [sbatch, srun, salloc]
  #     fail_mode: closed

webui:
  host: 127.0.0.1
  port: 8765
  open_browser: true
